folder:
- Match flow
alias: 'Match end: strip flashes, then returns to idle'
enabled: false
trigger_yaml: |
  - platform: state
    entity_id: vex_tm.main
    event_type: matchStopped
condition_yaml: null
action_yaml: |
  - service: wled.set_preset
    target_tag: fieldLights
    target_filter: '{{ (''field'' ~ trigger.payload.fieldID) in target.tags }}'
    data:
      preset: 6
  - delay: 00:00:04
  - service: wled.set_preset
    target_tag: fieldLights
    target_filter: '{{ (''field'' ~ trigger.payload.fieldID) in target.tags }}'
    data:
      preset: 1
