folder:
- Match flow
alias: 'Match start: camera to white preset (PTZ)'
enabled: true
trigger_yaml: |
  - platform: state
    entity_id: vex_tm.main
    event_type: matchStarted
condition_yaml: ''
action_yaml: |
  - service: ptz.recall_preset
    target: ptz.birddog
    data:
      preset: "{{ (states('vex_tm.main', 'current_field') | int) - 1 }}"
