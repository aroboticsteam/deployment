folder:
- Match flow
alias: 'Queue: camera to blue preset (PTZ)'
enabled: false
trigger_yaml: |
  - platform: state
    entity_id: vex_tm.main
    event_type: fieldMatchAssigned
condition_yaml: null
action_yaml: |
  - service: ptz.recall_preset
    target: ptz.birddog
    data:
      preset: "{{ (trigger.payload.fieldID | int) + 2 }}"
