folder:
- Display
alias: 'Results graphic: OBS to the results scene'
enabled: true
trigger_yaml: |
  - platform: state
    entity_id: vex_tm.main
    event_type: audienceDisplayChanged
condition_yaml: |
  - '{{ trigger.payload.display in [''RESULTS'', ''MATCH_RESULTS''] }}'
action_yaml: |
  - service: obs.switch_scene
    target: obs.main
    data:
      scene_name: IQ test
